<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">A task-shaped Agent-Team collaboration</title>
  <desc id="desc">A natural-language task is turned into an on-demand Developer, Reviewer, and Validator topology. Findings loop back to the Developer, and a clean validation produces an evidence-backed completion.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1A2530"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      .role { font-size: 19px; font-weight: 700; fill: #F5F7FA; }
      .detail { font-size: 13px; fill: #8D9AA8; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="378" rx="22" fill="#0B0F14" stroke="#25313D" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="376" rx="21" fill="url(#grid)"/>

  <g class="sans">
    <text x="42" y="56" class="eyebrow" fill="#54D2FF">ONE NATURAL-LANGUAGE TASK</text>
    <rect x="42" y="82" width="220" height="154" rx="16" fill="#111821" stroke="#2A3947" stroke-width="2"/>
    <path d="M72 116h24M72 127h31M72 138h18" fill="none" stroke="#54D2FF" stroke-width="3" stroke-linecap="round"/>
    <text x="72" y="178" font-size="23" font-weight="700" fill="#F5F7FA">Ship the change</text>
    <text x="72" y="205" class="detail">build · review · verify</text>

    <path d="M276 159H302" fill="none" stroke="#54D2FF" stroke-width="2.5"/>
    <path d="M302 153l11 6-11 6z" fill="#54D2FF"/>
    <rect x="318" y="132" width="130" height="54" rx="27" fill="#10232C" stroke="#54D2FF" stroke-width="2"/>
    <text x="383" y="154" text-anchor="middle" class="eyebrow" fill="#54D2FF">AGENT-TEAM</text>
    <text x="383" y="173" text-anchor="middle" font-size="11" fill="#8D9AA8">creates on demand</text>
    <path d="M462 159H490" fill="none" stroke="#54D2FF" stroke-width="2.5"/>
    <path d="M490 153l11 6-11 6z" fill="#54D2FF"/>

    <text x="506" y="56" class="eyebrow" fill="#8D9AA8">GENERATED TOPOLOGY · EXAMPLE</text>

    <rect x="506" y="92" width="150" height="116" rx="15" fill="#111821" stroke="#315064" stroke-width="2"/>
    <circle cx="532" cy="120" r="7" fill="#54D2FF"/>
    <text x="548" y="125" class="role">Developer</text>
    <text x="532" y="158" class="detail">implements + tests</text>
    <text x="532" y="183" class="mono" font-size="11" fill="#647586">Claude Code</text>

    <path d="M670 150H694" fill="none" stroke="#54D2FF" stroke-width="2.5"/>
    <path d="M694 144l11 6-11 6z" fill="#54D2FF"/>

    <rect x="710" y="92" width="150" height="116" rx="15" fill="#111821" stroke="#315064" stroke-width="2"/>
    <circle cx="736" cy="120" r="7" fill="#54D2FF"/>
    <text x="752" y="125" class="role">Reviewer</text>
    <text x="736" y="158" class="detail">challenges + routes</text>
    <text x="736" y="183" class="mono" font-size="11" fill="#647586">Codex</text>

    <path d="M874 150H898" fill="none" stroke="#54D2FF" stroke-width="2.5"/>
    <path d="M898 144l11 6-11 6z" fill="#54D2FF"/>

    <rect x="914" y="92" width="150" height="116" rx="15" fill="#111821" stroke="#315064" stroke-width="2"/>
    <circle cx="940" cy="120" r="7" fill="#54D2FF"/>
    <text x="956" y="125" class="role">Validator</text>
    <text x="940" y="158" class="detail">proves the result</text>
    <text x="940" y="183" class="mono" font-size="11" fill="#647586">DSH</text>

    <path d="M1078 150H1089" fill="none" stroke="#5EE39A" stroke-width="2.5"/>
    <path d="M1089 144l9 6-9 6z" fill="#5EE39A"/>
    <rect x="1102" y="105" width="64" height="90" rx="15" fill="#10231B" stroke="#397B59" stroke-width="2"/>
    <path d="M1120 142l8 8 18-21" fill="none" stroke="#5EE39A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1134" y="175" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#5EE39A">DONE</text>

    <path d="M785 220V268H581V222" fill="none" stroke="#FF7A6B" stroke-width="2.5" stroke-dasharray="7 7"/>
    <path d="M575 222l6-12 6 12z" fill="#FF7A6B"/>
    <rect x="648" y="248" width="70" height="28" rx="14" fill="#251817"/>
    <text x="683" y="267" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FF7A6B">findings</text>

    <line x1="506" y1="314" x2="1166" y2="314" stroke="#25313D"/>
    <circle cx="522" cy="338" r="4" fill="#54D2FF"/>
    <text x="536" y="343" class="mono" font-size="12" fill="#8D9AA8">formal handoffs</text>
    <circle cx="690" cy="338" r="4" fill="#54D2FF"/>
    <text x="704" y="343" class="mono" font-size="12" fill="#8D9AA8">private sessions</text>
    <circle cx="860" cy="338" r="4" fill="#54D2FF"/>
    <text x="874" y="343" class="mono" font-size="12" fill="#8D9AA8">explicit completion authority</text>
  </g>
</svg>
