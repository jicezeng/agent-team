[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-team"
version = "0.1.0"
description = "Natural-language, cross-harness temporary agent team runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent-Team contributors" }]
dependencies = []

[project.scripts]
agent-team = "agent_team.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_team"]

[tool.hatch.build.targets.wheel.force-include]
"skills/codex/agent-team" = "agent_team/bundled/skills/codex/agent-team"
"plugins/claude-code/agent-team" = "agent_team/bundled/plugins/claude-code/agent-team"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/skills",
  "/plugins",
  "/tests",
  "/docs",
  "/README.md",
  "/agent-team_technical_design_v0.1.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
]
