<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Team runtime architecture</title>
  <desc id="desc">Natural-language rules become immutable Request and Protocol files. An append-only Event Journal and small state reducer route formal events to native Codex, Claude Code, OpenCode, and DeepSeek Harness Sessions in lazy tmux Workers.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1A2530"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .step { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #54D2FF; }
      .heading { font-size: 21px; font-weight: 700; fill: #F5F7FA; }
      .detail { font-size: 13px; fill: #8D9AA8; }
      .pill { font-size: 11px; fill: #B9C3CD; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="22" fill="#0B0F14" stroke="#25313D" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="336" rx="21" fill="url(#grid)"/>

  <g class="sans">
    <text x="38" y="45" font-size="12" font-weight="700" letter-spacing="1.7" fill="#8D9AA8">A SMALL, INSPECTABLE CORE</text>

    <rect x="38" y="70" width="226" height="176" rx="16" fill="#111821" stroke="#2A3947" stroke-width="2"/>
    <text x="60" y="101" class="step">01 · DEFINE</text>
    <text x="60" y="139" class="heading">Natural language</text>
    <text x="60" y="166" class="detail">task + rules + limits</text>
    <path d="M60 201h42M60 213h62M60 225h32" fill="none" stroke="#54D2FF" stroke-width="3" stroke-linecap="round"/>

    <path d="M276 158H293" fill="none" stroke="#54D2FF" stroke-width="2.5"/>
    <path d="M293 152l11 6-11 6z" fill="#54D2FF"/>

    <rect x="310" y="70" width="226" height="176" rx="16" fill="#111821" stroke="#2A3947" stroke-width="2"/>
    <text x="332" y="101" class="step">02 · FREEZE</text>
    <text x="332" y="139" class="heading">Immutable Run</text>
    <text x="332" y="166" class="detail">human-readable contract</text>
    <rect x="332" y="190" width="84" height="31" rx="8" fill="#19232D"/>
    <text x="374" y="210" text-anchor="middle" class="mono pill">REQUEST.md</text>
    <rect x="426" y="190" width="88" height="31" rx="8" fill="#19232D"/>
    <text x="470" y="210" text-anchor="middle" class="mono pill">PROTOCOL.md</text>

    <path d="M548 158H565" fill="none" stroke="#54D2FF" stroke-width="2.5"/>
    <path d="M565 152l11 6-11 6z" fill="#54D2FF"/>

    <rect x="582" y="56" width="276" height="204" rx="16" fill="#102028" stroke="#54D2FF" stroke-width="2"/>
    <text x="606" y="87" class="step">03 · REDUCE</text>
    <text x="606" y="125" class="heading">Event Journal</text>
    <text x="606" y="151" class="detail">append-only source of truth</text>
    <rect x="606" y="175" width="228" height="31" rx="8" fill="#142B34"/>
    <text x="720" y="195" text-anchor="middle" class="mono" font-size="10" fill="#9EC7D5">kickoff · handoff · complete · block</text>
    <line x1="606" y1="224" x2="834" y2="224" stroke="#2A4653"/>
    <text x="606" y="246" class="mono" font-size="11" fill="#B9C3CD">validated → persisted → reduced</text>

    <path d="M870 158H887" fill="none" stroke="#54D2FF" stroke-width="2.5"/>
    <path d="M887 152l11 6-11 6z" fill="#54D2FF"/>

    <rect x="904" y="70" width="258" height="176" rx="16" fill="#111821" stroke="#2A3947" stroke-width="2"/>
    <text x="926" y="101" class="step">04 · RUN</text>
    <text x="926" y="139" class="heading">Native Sessions</text>
    <rect x="926" y="161" width="96" height="27" rx="7" fill="#19232D"/>
    <text x="974" y="179" text-anchor="middle" class="mono pill">Codex</text>
    <rect x="1032" y="161" width="108" height="27" rx="7" fill="#19232D"/>
    <text x="1086" y="179" text-anchor="middle" class="mono pill">Claude Code</text>
    <rect x="926" y="198" width="96" height="27" rx="7" fill="#19232D"/>
    <text x="974" y="216" text-anchor="middle" class="mono pill">OpenCode</text>
    <rect x="1032" y="198" width="108" height="27" rx="7" fill="#19232D"/>
    <text x="1086" y="216" text-anchor="middle" class="mono pill">DSH</text>

    <line x1="38" y1="286" x2="1162" y2="286" stroke="#25313D"/>
    <circle cx="50" cy="312" r="4" fill="#5EE39A"/>
    <text x="64" y="317" class="mono" font-size="12" fill="#8D9AA8">files + journal determine state</text>
    <circle cx="342" cy="312" r="4" fill="#54D2FF"/>
    <text x="356" y="317" class="mono" font-size="12" fill="#8D9AA8">tmux hosts lazy Workers</text>
    <circle cx="617" cy="312" r="4" fill="#FF7A6B"/>
    <text x="631" y="317" class="mono" font-size="12" fill="#8D9AA8">pane text never changes state</text>
    <text x="1148" y="317" text-anchor="end" class="mono" font-size="11" fill="#647586">status · watch · transcript · trace</text>
  </g>
</svg>
